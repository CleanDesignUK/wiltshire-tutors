{% macro enquiry_form(context='general', compact=False) -%}
<form class="nwt-secure-form enquiry-form {{ 'form-compact' if compact else '' }}" method="POST" action="https://api.web3forms.com/submit" data-enquiry-form data-form-type="{{ 'careers' if context=='careers' else 'tutoring' }}" data-form-name="{{ context }}" data-form-location="{{ path }}">
  <input type="hidden" name="access_key" value="476685a4-53cf-4a10-953e-fbb901fdada7">
  <input type="hidden" name="subject" value="Wiltshire Tutoring - New {{ context|replace('-', ' ')|title }} Enquiry">
  <input type="hidden" name="from_name" value="Wiltshire Tutoring Website">
  <input type="hidden" name="page" value="{{ path }}">
  <div class="botcheck" aria-hidden="true"><input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"></div>
  <div class="form-field"><label for="{{ context }}-name">Your name</label><input id="{{ context }}-name" name="name" type="text" placeholder="Your name" autocomplete="name" minlength="2" maxlength="100" required></div>
  <div class="form-split"><div class="form-field"><label for="{{ context }}-email">Email address</label><input id="{{ context }}-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="150" required></div><div class="form-field"><label for="{{ context }}-phone">Phone number</label><input id="{{ context }}-phone" name="phone" type="tel" placeholder="Your phone number" autocomplete="tel" maxlength="30" required></div></div>
  <div class="form-field"><label for="{{ context }}-message">{{ 'Tell us about your tutoring experience and application' if context=='careers' else 'What support do you need?' }}</label><textarea id="{{ context }}-message" name="message" rows="{{ '2' if compact else '4' }}" maxlength="2000" minlength="10" placeholder="{{ 'Tell us about the subjects and levels you tutor, your teaching experience, Enhanced DBS and availability' if context=='careers' else 'e.g. Year 11 GCSE Maths, AQA, looking for weekly online lessons' }}" required></textarea></div>
  <button type="submit" class="btn btn-primary-custom form-submit">{{ 'Submit Tutor Enquiry' if context=='careers' else 'Find My Tutor' }}</button>
  <p class="form-note">{{ 'We use your details to respond to your application enquiry.' if context=='careers' else 'No obligation to book. We will only use your details to respond to your enquiry.' }} <a href="/privacy-policy.html">Privacy Policy</a>.</p>
  <p class="form-feedback visually-hidden" role="status" aria-live="polite"></p>
</form>
{%- endmacro %}
